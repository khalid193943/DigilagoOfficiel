name: Tests du site et de la gestion

# La mise en ligne est faite par Vercel à chaque envoi sur main
# (projets digilago / digilago-officel pour le site, digilago-gestion pour la gestion).
# Ce contrôle vérifie, en parallèle, que tout fonctionne : un ✗ rouge sur GitHub signale un problème.

on:
  push:
    branches: [main, perf-design-pass]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    name: Site (FR, EN, AR) dans un vrai navigateur
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les outils de test
        run: |
          pip install pytest pytest-playwright
          python -m playwright install --with-deps chromium
      - name: Lancer les tests
        run: pytest tests -q

  gestion:
    name: Espace de gestion
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
