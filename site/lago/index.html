<style>:root{--navy:#0E214E;--night:#071433;--blue:#2F84EC;--deep:#1F57C7;--sky:#5F9FF9;--ice:#9FC8FF;--pale:#DDEBFF;--sun:#F5B83D;--green:#3DDC97;--red:#E5484D;--ink:#4A5876;--u:1px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--night);color:#fff;font-family:"Instrument Sans",system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
.sora{font-family:Sora,sans-serif;letter-spacing:-.03em}
.hide{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

/* ─── boutons ─────────────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 28px;border-radius:999px;background:var(--sun);color:var(--navy);font:600 17px/1 Sora,sans-serif;letter-spacing:-.02em;text-decoration:none;box-shadow:0 10px 30px -10px rgba(245,184,61,.7),inset 0 -3px 0 rgba(14,33,78,.18);transition:transform .2s cubic-bezier(.2,1.6,.4,1)}
.btn:active{transform:scale(.96)}
.btn.ghost{background:rgba(255,255,255,.08);color:#fff;box-shadow:inset 0 0 0 1.5px rgba(159,200,255,.35)}
.btn.light{background:#fff;color:var(--navy);box-shadow:0 10px 30px -14px rgba(0,0,0,.5)}
.btn.small{min-height:42px;padding:0 18px;font-size:14px}
.btn svg{width:18px;height:18px}

/* ─── écrans (titre, cartes, fin) ─────────────────────────────────────── */
.screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));text-align:center;opacity:0;pointer-events:none;transition:opacity .45s ease}
.screen.on{opacity:1;pointer-events:auto}
.screen.dim{background:radial-gradient(120% 90% at 50% 30%,rgba(14,33,78,.72),rgba(7,20,51,.92))}
.title-k{display:flex;align-items:center;gap:10px;font:500 15px/1 Sora,sans-serif;color:var(--ice);letter-spacing:-.01em}
.title-k svg{width:22px;height:26px}
.title-h{font:600 clamp(72px,17vw,150px)/.9 Sora,sans-serif;letter-spacing:-.06em;margin-top:18px;background:linear-gradient(180deg,#fff 30%,#BFD8FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.title-s{font:italic 500 clamp(24px,5vw,38px)/1.1 "Playfair Display",Georgia,serif;color:var(--sun);margin-top:6px}
.title-p{max-width:30em;margin:18px auto 0;color:#DDE7F6;font-size:16px;line-height:1.5;text-shadow:0 2px 12px rgba(3,9,24,.9)}
.screen:not(.dim) .title-h,.screen:not(.dim) .title-s{filter:drop-shadow(0 6px 24px rgba(3,9,24,.8))}
.title-b{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:28px}
.title-f{position:absolute;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom));color:#8FA6CC;font-size:12.5px;padding:0 16px}
.title-f a{color:inherit}
.rotate-hint{display:none;align-items:center;gap:8px;margin-top:18px;color:var(--ice);font-size:13.5px}
.rotate-hint svg{width:22px;height:22px}
@media (orientation:portrait) and (pointer:coarse){.rotate-hint{display:flex}}

/* légendes du prologue */
.cap{position:fixed;left:0;right:0;bottom:max(13vh,90px);z-index:21;padding:0 22px;text-align:center;pointer-events:none}
.cap p{display:inline-block;max-width:24em;font:500 clamp(20px,3.6vw,32px)/1.25 Sora,sans-serif;letter-spacing:-.03em;text-wrap:balance;opacity:0;transform:translateY(12px);transition:opacity .7s ease,transform .7s cubic-bezier(.16,1,.3,1)}
.cap p.on{opacity:1;transform:none}
.cap p b{color:var(--sun);font-weight:600}
.cap small{display:block;margin-top:10px;font:400 12.5px/1.4 "Instrument Sans",sans-serif;color:#8FA6CC;letter-spacing:0}
.skip{position:fixed;z-index:22;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right))}

/* ─── HUD ─────────────────────────────────────────────────────────────── */
#hud{position:fixed;z-index:10;left:0;right:0;top:0;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));pointer-events:none}
#hud .grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px 0 9px;border-radius:999px;background:rgba(7,20,51,.62);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(159,200,255,.18);font:600 14px/1 Sora,sans-serif;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.chip svg{width:18px;height:18px;flex:none}
.chip .suns{display:flex;gap:3px}
.chip .suns i{width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#FFF4C2,#F5B83D 60%,#D99417);box-shadow:0 0 8px rgba(245,184,61,.8)}
.chip .suns i.off{background:rgba(159,200,255,.18);box-shadow:none}
.chip.pop{animation:chipPop .4s cubic-bezier(.2,1.8,.4,1)}
@keyframes chipPop{40%{transform:scale(1.14)}}
.ibtn{pointer-events:auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(7,20,51,.62);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(159,200,255,.22)}
.ibtn svg{width:19px;height:19px}
.lvl-name{font:600 13px/1 Sora,sans-serif;color:var(--ice);padding:0 6px;letter-spacing:-.01em;text-shadow:0 1px 6px rgba(0,0,0,.6)}

/* ─── commandes tactiles ──────────────────────────────────────────────── */
#pad{position:fixed;z-index:11;left:0;right:0;bottom:0;display:none;justify-content:space-between;align-items:flex-end;padding:0 max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));pointer-events:none}
body.touch #pad{display:flex}
#pad .side{display:flex;gap:12px;align-items:flex-end;pointer-events:auto}
.pb{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.12);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.25);touch-action:none}
.pb svg{width:30px;height:30px}
.pb.on{background:rgba(255,255,255,.3);transform:scale(.94)}
.pb.jump{width:88px;height:88px;background:rgba(47,132,236,.55)}
.pb.act{background:rgba(245,184,61,.5)}
.pb.act.ready{animation:actReady 1.1s ease-in-out infinite}
@keyframes actReady{50%{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.4),0 0 0 10px rgba(245,184,61,.25)}}
@media (max-height:420px){.pb{width:62px;height:62px}.pb.jump{width:74px;height:74px}}

/* ─── dialogues ───────────────────────────────────────────────────────── */
.dlg{position:fixed;z-index:30;left:50%;bottom:max(18px,env(safe-area-inset-bottom));width:min(640px,calc(100% - 24px));transform:translate(-50%,24px);opacity:0;pointer-events:none;transition:opacity .3s,transform .4s cubic-bezier(.16,1,.3,1);display:flex;gap:14px;align-items:flex-end}
.dlg.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.dlg .who{flex:none;width:118px;height:132px;position:relative;margin-bottom:-6px}
.dlg .who svg{position:absolute;width:190%;left:-45%;bottom:-24%;filter:drop-shadow(0 10px 20px rgba(0,0,0,.4))}
.dlg .box{flex:1;min-width:0;background:#fff;color:var(--navy);border-radius:22px;padding:16px 18px 14px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.dlg .nm{font:600 15px/1.1 Sora,sans-serif;letter-spacing:-.02em}
.dlg .rl{font-size:12.5px;color:var(--ink);margin-top:2px}
.dlg .tx{margin-top:8px;font-size:16px;line-height:1.45;min-height:2.9em}
.dlg .ch{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.dlg .ch button{text-align:left;padding:12px 14px;border-radius:14px;background:#F2F6FC;font-size:15px;line-height:1.3;box-shadow:inset 0 0 0 1.5px #DCE6F5}
.dlg .ch button:hover{box-shadow:inset 0 0 0 2px var(--blue)}
.dlg .nx{display:flex;justify-content:flex-end;margin-top:6px}
.dlg .nx button{display:inline-flex;align-items:center;gap:6px;font:600 13.5px/1 Sora,sans-serif;color:var(--deep);padding:8px 4px}
.dlg .nx svg{width:16px;height:16px}
@media (max-width:520px){.dlg .who{width:84px;height:100px}.dlg .tx{font-size:15px}}

/* ─── notes « le site de ce métier » ──────────────────────────────────── */
.note{position:fixed;z-index:15;right:max(12px,env(safe-area-inset-right));top:calc(max(10px,env(safe-area-inset-top)) + 50px);width:min(330px,calc(100% - 24px));display:flex;gap:12px;padding:12px;border-radius:20px;background:rgba(255,255,255,.96);color:var(--navy);box-shadow:0 26px 60px -20px rgba(0,0,0,.65);transform:translateX(calc(100% + 30px));transition:transform .55s cubic-bezier(.16,1,.3,1);pointer-events:auto}
.note.on{transform:none}
.note .ph{flex:none;width:92px;height:168px;border-radius:16px;background:var(--navy);padding:5px;position:relative;box-shadow:0 10px 20px -10px rgba(0,0,0,.5)}
.note .scr{width:100%;height:100%;border-radius:12px;overflow:hidden;background:#fff;display:flex;flex-direction:column;position:relative}
.note .url,.pitch .scr .url{flex:none;display:flex;align-items:center;gap:3px;height:13px;padding:0 5px;background:#F2F6FC;border-bottom:1px solid #E3EAF5;font:500 6px/1 Sora,sans-serif;color:#41517A;white-space:nowrap;overflow:hidden}
.note .url i,.pitch .scr .url i{flex:none;width:4px;height:4px;border-radius:50%;background:var(--green)}
.note .shot{position:absolute;left:0;right:0;top:13px;bottom:0;background:#fff top/cover no-repeat;opacity:0;transition:opacity .35s}
.note .shot.on{opacity:1}
.note .hero{height:62px;background:#C9D7EC center/cover no-repeat;position:relative}
.note .hero b{position:absolute;left:5px;right:5px;bottom:5px;color:#fff;font:600 7.5px/1.15 Sora,sans-serif;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.note .rows{flex:1;display:flex;flex-direction:column;gap:4px;padding:6px 5px}
.note .rows i{display:flex;align-items:center;gap:4px;height:15px;border-radius:5px;background:#F2F6FC;font:600 6.5px/1 Sora,sans-serif;color:var(--navy);font-style:normal;padding:0 4px;white-space:nowrap;overflow:hidden}
.note .rows i::before{content:"";flex:none;width:6px;height:6px;border-radius:50%;background:var(--blue)}
.note .rows i.cta{background:var(--green);justify-content:center}
.note .rows i.cta::before{display:none}
.note .tx{min-width:0;display:flex;flex-direction:column}
.note .k{font:600 11px/1 Sora,sans-serif;color:var(--deep);letter-spacing:-.01em}
.note h4{font:600 16px/1.15 Sora,sans-serif;letter-spacing:-.03em;margin-top:6px}
.note ul{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:5px;font-size:13px;line-height:1.3;color:#33415E}
.note li{display:flex;gap:6px}
.note li::before{content:"";flex:none;width:6px;height:6px;margin-top:6px;border-radius:50%;background:var(--sun)}
.note a{margin-top:auto;padding-top:8px;font:600 12.5px/1.2 Sora,sans-serif;color:var(--deep);text-decoration:none}
@media (max-height:460px){.note .ph{height:140px}.note .hero{height:48px}}

/* ─── toasts ──────────────────────────────────────────────────────────── */
.toast{position:fixed;z-index:16;left:50%;top:calc(max(10px,env(safe-area-inset-top)) + 54px);transform:translate(-50%,-12px);opacity:0;padding:10px 16px;border-radius:999px;background:rgba(7,20,51,.86);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:inset 0 0 0 1px rgba(159,200,255,.25);font:500 14px/1.3 Sora,sans-serif;letter-spacing:-.02em;max-width:calc(100% - 24px);text-align:center;transition:opacity .3s,transform .4s cubic-bezier(.16,1,.3,1);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ─── cartes (début et fin de niveau, pause) ──────────────────────────── */
.card{width:min(560px,100%);max-height:100%;overflow:auto;background:linear-gradient(180deg,#132C66,#0B1D4A);border-radius:28px;padding:28px 26px 24px;box-shadow:inset 0 0 0 1px rgba(159,200,255,.18),0 40px 80px -30px rgba(0,0,0,.8);text-align:left}
.card .k{font:500 13px/1 Sora,sans-serif;color:var(--sun);letter-spacing:-.01em}
.card h2{font:600 clamp(28px,5vw,40px)/1.05 Sora,sans-serif;letter-spacing:-.045em;margin-top:10px}
.card h2 em{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:500;color:var(--sun)}
.card p{margin-top:10px;color:#C9D7EC;font-size:15.5px;line-height:1.5}
.card .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.card .goals{list-style:none;padding:0;margin:18px 0 0;display:flex;flex-direction:column;gap:9px}
.card .goals li{display:flex;align-items:center;gap:10px;font-size:15px;color:#E4ECF8}
.card .goals svg{width:20px;height:20px;flex:none}
.stars{display:flex;gap:14px;margin-top:18px}
.stars .st{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:16px;background:rgba(255,255,255,.05);text-align:center;font-size:12.5px;line-height:1.25;color:#AFC1DE}
.stars .st svg{width:34px;height:34px;transform:scale(0);transition:transform .45s cubic-bezier(.2,1.8,.4,1)}
.stars .st.on svg{transform:scale(1)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats div{padding:10px;border-radius:14px;background:rgba(255,255,255,.05);font-size:12px;color:#AFC1DE}
.stats b{display:block;font:600 20px/1.1 Sora,sans-serif;color:#fff;letter-spacing:-.03em;font-variant-numeric:tabular-nums}

/* fin de niveau : « votre site » */
.pitch{margin-top:20px;padding:18px;border-radius:22px;background:#fff;color:var(--navy);display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.pitch h3{font:600 20px/1.12 Sora,sans-serif;letter-spacing:-.035em}
.pitch h3 em{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:500;color:var(--deep)}
.pitch p{color:var(--ink);font-size:14px;margin-top:6px;line-height:1.45}
.pitch ul{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-wrap:wrap;gap:6px}
.pitch li{padding:6px 10px;border-radius:999px;background:#F2F6FC;font:500 12.5px/1 Sora,sans-serif;color:var(--navy)}
.pitch .ph{width:96px;height:180px;border-radius:18px;background:var(--navy);padding:5px;box-shadow:0 16px 30px -12px rgba(14,33,78,.6)}
.pitch .scr{width:100%;height:100%;border-radius:14px;overflow:hidden;background:linear-gradient(180deg,#DDEBFF,#fff 46%);display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 8px 16px}
.pitch .scr .url{align-self:stretch;margin:0 -8px 8px;height:16px;font-size:7px;justify-content:center}
.pitch .scr .lg{width:30px;height:34px}
.pitch .scr b{font:600 9px/1.15 Sora,sans-serif;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pitch .scr i{display:block;width:100%;height:12px;border-radius:5px;background:#E8F0FB}
.pitch .scr i.c{background:var(--sun);margin-top:auto}
.pitch .full{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px}
.pitch input{flex:1;min-width:180px;height:50px;border-radius:14px;border:0;padding:0 14px;background:#F2F6FC;box-shadow:inset 0 0 0 1.5px #DCE6F5;font:500 16px Sora,sans-serif;color:var(--navy)}
@media (max-width:480px){.pitch{grid-template-columns:1fr}.pitch .ph{display:none}}

/* niveaux (carte du Maroc) */
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:18px}
.lv{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:14px;border-radius:18px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(159,200,255,.16);text-align:left}
.lv b{font:600 17px/1.1 Sora,sans-serif;letter-spacing:-.03em}
.lv span{font-size:12.5px;color:#AFC1DE}
.lv.play{background:rgba(245,184,61,.14);box-shadow:inset 0 0 0 1.5px rgba(245,184,61,.6)}

      if (s === 8) tone(mtof(ch[0] - 12 + 7), nextT, BEAT * 1.2, 'sine', 0.16, musicGain, 0.02);
      if (intensity > 0.45) { if (s === 0 || s === 8) kick(nextT, 0.32 * intensity); if (s % 4 === 2) noise(nextT, 0.04, 0.05 * intensity, 7000, 9000, musicGain, 'highpass'); }
      if (intensity > 0.75 && (s === 4 || s === 12)) noise(nextT, 0.12, 0.08, 1500, 3000, musicGain);
      if (bar === 3 && s === 12 && intensity > 0.6) [74, 78, 81].forEach((m, i) => glock(m, nextT + i * S16, 0.06, musicGain));
      nextT += S16; step++;
    }
  }
  function music(start = true) {
    init(); if (!ctx) return;
    if (start && !playing) { playing = true; nextT = ctx.currentTime + 0.1; timer = setInterval(schedule, 60); }
    if (!start && playing) { playing = false; clearInterval(timer); }
  }
  // ------------------------------------------------------------------ bruitages
  const now = () => ctx ? ctx.currentTime : 0;
  const fx = {
    tap: () => tone(880, now(), 0.06, 'sine', 0.15),
    pop: () => { const t = now(); const o = tone(520, t, 0.1, 'sine', 0.25); o && o.frequency.exponentialRampToValueAtTime(1100, t + 0.09); },

    miss: () => { const t = now(); tone(330, t, 0.14, 'triangle', 0.18); tone(247, t + 0.12, 0.2, 'triangle', 0.18); },
    stamp: () => { const t = now(); kick(t, 0.6); noise(t, 0.08, 0.3, 300, 2000); },
    whoosh: () => noise(now(), 0.45, 0.22, 400, 6000),
    chime: () => { const t = now(); [86, 90, 93].forEach((m, i) => glock(m, t + i * 0.06, 0.16)); },
    success: () => { const t = now(); [74, 78, 81, 86].forEach((m, i) => glock(m, t + i * 0.11, 0.22)); kick(t, 0.4); },
    star: () => { const t = now(); glock(93, t, 0.18); glock(98, t + 0.08, 0.12); },
    msg: () => { const t = now(); glock(88, t, 0.16); glock(93, t + 0.1, 0.16); },
    type: () => noise(now(), 0.03, 0.08, 2500, 6000),
    squash: () => { const t = now(); const o = tone(300, t, 0.12, 'square', 0.12); o && o.frequency.exponentialRampToValueAtTime(90, t + 0.1); },
    pour: () => noise(now(), 0.25, 0.08, 800, 1200, sfxGain, 'lowpass'),
    kickball: () => { kick(now(), 0.5); noise(now(), 0.06, 0.2, 1000, 3000); },
    goal: () => { const t = now(); noise(t, 0.8, 0.12, 800, 2400); [74, 78, 81, 86, 90].forEach((m, i) => glock(m, t + 0.1 + i * 0.07, 0.15)); },
    jump: () => { const t = now(); const o = tone(420, t, 0.12, 'sine', 0.16); o && o.frequency.exponentialRampToValueAtTime(760, t + 0.1); },
    dbl: () => { const t = now(); noise(t, 0.18, 0.12, 1800, 5000); const o = tone(620, t, 0.14, 'sine', 0.12); o && o.frequency.exponentialRampToValueAtTime(1100, t + 0.12); },
    land: () => noise(now(), 0.07, 0.12, 300, 900, sfxGain, 'lowpass'),
    spark: () => { const t = now(); glock(98 + Math.floor(Math.random() * 3) * 2, t, 0.09); },
    burst: () => { const t = now(); noise(t, 0.35, 0.16, 600, 7000); tone(880, t, 0.25, 'sine', 0.1); },
    hurt: () => { const t = now(); const o = tone(300, t, 0.3, 'triangle', 0.2); o && o.frequency.exponentialRampToValueAtTime(120, t + 0.28); },
    bounce: () => { const t = now(); const o = tone(300, t, 0.2, 'sine', 0.22); o && o.frequency.exponentialRampToValueAtTime(900, t + 0.16); },
    grapple: () => { const t = now(); noise(t, 0.15, 0.1, 3000, 6000); tone(1200, t, 0.08, 'sine', 0.1); },
    poof: () => { const t = now(); noise(t, 0.25, 0.14, 1200, 300, sfxGain, 'lowpass'); glock(91, t + 0.05, 0.08); },
    fall: () => { const t = now(); const o = tone(600, t, 0.6, 'sine', 0.14); o && o.frequency.exponentialRampToValueAtTime(140, t + 0.55); },
    online: () => { const t = now(); kick(t, 0.5); [62, 66, 69, 74, 78, 81, 86].forEach((m, i) => glock(m + 12, t + i * 0.07, 0.15)); noise(t, 1.2, 0.06, 6000, 9000); },
  };
  function play(name) { if (!on) return; init(); if (ctx && fx[name]) try { fx[name](); } catch (e) {} }
  function setIntensity(v) { intensity = Math.max(0, Math.min(1, v)); }
  function toggle() { on = !on; try { localStorage.setItem('lago-sound', on ? 'on' : 'off'); } catch (e) {} if (master) master.gain.value = on ? 0.8 : 0; return on; }
  return { unlock, music, play, setIntensity, toggle, get on() { return on; } };
})();

// ─── physique ───────────────────────────────────────────────────────────────────────────────
const over = (ax, ay, aw, ah, b) => ax < b.x + b.w && ax + aw > b.x && ay < b.y + b.h && ay + ah > b.y;
function step(dt) {

    const ph = (G.t / m.period) % 1, d = m.dwell || 0;
    // un ascenseur marque une pause en bas et en haut, le temps de monter ou de descendre
    const k = !d ? .5 - .5 * Math.cos(2 * Math.PI * ph)

  G.msgT = Math.max(0, G.msgT - dt);

function move(dt) {

  for (const s of P.solids) {
    if (over(pl.x - PW / 2, pl.y - PH, PW, PH - 2, s)) {
      if (pl.x < s.x + s.w / 2) pl.x = s.x - PW / 2; else pl.x = s.x + s.w + PW / 2;
      pl.vx = 0;
    }
  }
  if (pl.x < -320) { pl.x = -320; pl.vx = 0; }
  // vertical
  const prev = pl.y;
  pl.y += pl.vy * dt;
  pl.onG = false; const oldRef = pl.gRef; pl.gRef = null;
  for (const s of P.solids) {
    if (over(pl.x - PW / 2, pl.y - PH, PW, PH, s)) {
      if (pl.vy >= 0 && prev <= s.y + 6) { pl.y = s.y; pl.vy = 0; pl.onG = true; }

function grappleStep(dt, dir) {

  LV.forEach(l => list.append(h('button', { class: 'lv ' + (l.open ? 'play' : 'lock'), onclick: () => { if (l.open) { closeScreen(s); play(); } else toast(`${l.city} arrive dans une prochaine mise à jour.`); } },
    h('span', {}, `Niveau ${l.n}`), h('b', {}, l.city), h('span', {}, l.open ? (SV.done[l.id] ? 'Allumée' : 'Jouable') : 'Bientôt'))));
  s.append(h('div', { class: 'card' }, h('div', { class: 'k' }, 'Les villes'), h('h2', {}, 'Une ville, ', h('em', {}, 'un niveau.')),
    h('p', {}, 'Chaque ville a son identité, ses métiers et ses entreprises à allumer. Casablanca ouvre la route.'), list,
    h('div', { class: 'row' }, h('button', { class: 'btn ghost', onclick: () => closeScreen(s) }, 'Retour'))));
}

// ─── prologue : la Terre la nuit ─────────────────────────────────────────────────────────────
async function prologue() {
  const caps = h('div', { class: 'cap' }); ui.append(caps);
  let skip = false;
  const sk = h('button', { class: 'btn ghost small skip', onclick: () => { skip = true; } }, 'Passer');
  ui.append(sk);
  const KF = [
    { t: 0, lon: -100, lat: 20, z: .95, maPulse: 0, cy: .44 },
    { t: 5.5, lon: -45, lat: 28, z: 1.0, maPulse: 0, cy: .44 },
    { t: 11, lon: 8, lat: 40, z: 1.25, maPulse: 0, cy: .44 },
    { t: 17, lon: -6.5, lat: 31, z: 3.6, maPulse: 1, cy: .42 },
    { t: 23, lon: -7.3, lat: 32.6, z: 5.6, maPulse: 1, casaFlare: 1, cy: .42 },
  ];
  globeLoop(t => Object.assign(keyframes(KF, t), { t }));
  const lines = [
    [600, 'La Terre, la nuit. Chaque lumière est une entreprise que l’on trouve en ligne.', 'Illustration'],
    [6000, 'En Allemagne, <b>89 %</b> des entreprises ont un site web. En France, <b>70 %</b>.', ''],
    [12000, 'Au Maroc, seulement <b>31 %</b>. Sept entreprises sur dix restent invisibles.', 'Source : HCP, enquête 2019 publiée en 2022 ; comparaison citée par Hespress.'],
    [18500, 'Digilago s’est donné une mission : <b>allumer le Maroc</b>.', ''],
  ];
  const t0 = performance.now();
  for (let i = 0; i < lines.length && !skip; i++) {
    while (!skip && performance.now() - t0 < lines[i][0]) await wait(80);
    if (skip) break;
    caps.innerHTML = ''; const p = h('p', { html: lines[i][1] + (lines[i][2] ? `<small>${lines[i][2]}</small>` : '') }); caps.append(p);
    requestAnimationFrame(() => p.classList.add('on')); SND.play('chime');
  }
  while (!skip && performance.now() - t0 < 23500) await wait(80);
  caps.remove(); sk.remove();
  globeStop();
  await studio();
}
// au Studio, sur le toit : la mission
async function studio() {
  const bgk = 'bg_medina';
  let alive = true;
  const draw = () => {
    if (!alive) return; requestAnimationFrame(draw);
    const DPR = Math.min(2, window.devicePixelRatio || 1), W = window.innerWidth, H = window.innerHeight;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const bg = E.SPR[bgk];
    ctx.fillStyle = '#071433'; ctx.fillRect(0, 0, W, H);
    if (bg) { const s = Math.max(W / bg.c.width, H / bg.c.height) * 1.05; ctx.drawImage(bg.c, (W - bg.c.width * s) / 2, H - bg.c.height * s, bg.c.width * s, bg.c.height * s); }
    const g = ctx.createLinearGradient(0, H * .45, 0, H); g.addColorStop(0, 'rgba(7,20,51,0)'); g.addColorStop(1, 'rgba(7,20,51,.92)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#E8E1D3'; ctx.fillRect(0, H * .62, W, H * .4); ctx.fillStyle = '#B9AE98'; ctx.fillRect(0, H * .62, W, 6);
    const sc = Math.min(W, H * 1.6) / 1000, base = H * .62;
    const put = (k, x, f = 1) => { const sp = E.SPR[k]; if (!sp) return; const s = sc * 1.45 * f; ctx.drawImage(sp.c, x - sp.ax * s, base - sp.ay * s, sp.w * s, sp.h * s); };
    put('radar', W * .32); put('p_salut', W * .5, 1.05); put('gestion', W * .68, 1.15);
  };
  draw();
  const lines = [
    ['gestion_salut', 'Gestion', 'Devis et accords', 'Sept entreprises sur dix ne sont pas visibles en ligne. On commence par Casablanca ?'],
    ['radar_salut', 'Radar', 'Le repérage', 'J’ai repéré cinq commerces éteints dans la médina. Je te guiderai avec ma flèche.'],
    ['p_salut', 'Lago', 'Le D de Digilago', 'Alors on y va. Avec la Lanterne, on les allume un par un.'],
    ['gestion_salut', 'Gestion', 'Devis et accords', 'Passe par mes kiosques en chemin : chaque devis signé garde ta progression.'],
  ];
  for (const l of lines) await say(...l);
  closeDlg(); alive = false;
  SV.intro = true; save();
}

// ─── partie ─────────────────────────────────────────────────────────────────────────────────
let curLevel = null;
async function play() {
  SND.unlock(); SND.music(true); SND.setIntensity(.35);
  track('jeu_lago_debut', { reprise: !!SV.intro });
  if (document.body.classList.contains('touch')) { try { await document.documentElement.requestFullscreen({ navigationUI: 'hide' }); await window.screen.orientation.lock('landscape'); } catch (e) {} }
  if (title.s) { closeScreen(title.s); title.s = null; }
  if (!SV.intro) await prologue();
  curLevel = LV[SV.lvl] || LV[0];
  if (SV.part >= curLevel.parts.length) { SV.part = 0; SV.cur = null; }
  await startPart(SV.part, SV.cur);
}
async function startPart(idx, cur) {
  globeStop();
  const P = curLevel.parts[idx];
  E.G.abil = new Set(SV.abil); E.G.maxHearts = SV.maxHearts;
  E.load(curLevel, idx, cur);
  lvlName.textContent = `${curLevel.city} · ${P.name}`;
  E.start(); E.G.hold = true;
  hudEl.classList.remove('hide'); pad.style.visibility = 'hidden';
  if (!cur) await partIntro(P, idx);
  pad.style.visibility = ''; E.G.hold = false;
  SND.setIntensity(.35 + idx * .15);
}
function partIntro(P, idx) {
  return new Promise(res => {
    const s = screen('dim');
    const touch = document.body.classList.contains('touch');
    const goals = [`Allume les ${P.shops.filter(x => !x.bonus).length} commerces du quartier`, 'Ramasse les étincelles', P.shops.some(x => x.bonus) ? 'Trouve le commerce caché' : 'Évite les Ombres de l’Oubli, ou saute dessus'];
    const ctrl = touch ? 'Flèches pour avancer, bouton bleu pour sauter, bouton doré pour la Lanterne.' : 'Flèches ou Q/D pour avancer, Espace pour sauter, X pour la Lanterne.';
    s.append(h('div', { class: 'card' },
      h('div', { class: 'k' }, `Niveau ${curLevel.n} · ${curLevel.city} · quartier ${idx + 1} sur ${curLevel.parts.length}`),
      h('h2', {}, P.name.replace(/^(La|Le) /, m => m), ' ', h('em', {}, 'de nuit.')),
      h('ul', { class: 'goals' }, ...goals.map(g => h('li', { html: ICON.dot + `<span>${g}</span>` }))),
      h('p', {}, ctrl),
      h('div', { class: 'row' }, h('button', { class: 'btn', onclick: () => { SND.play('success'); closeScreen(s).then(res); } }, 'C’est parti'))));
    setTimeout(() => s.querySelector('.btn').focus(), 500);
  });
}
function pause() {
  if (!E.G.running || E.G.paused) return;
  E.G.paused = true;
  const s = screen('dim');
  const resume = () => { E.G.paused = false; closeScreen(s); };
  s.append(h('div', { class: 'card' }, h('div', { class: 'k' }, `${curLevel.city} · ${E.G.P.name}`), h('h2', {}, 'Pause'),
    h('div', { class: 'row' }, h('button', { class: 'btn', onclick: resume }, 'Reprendre'),
      h('button', { class: 'btn ghost', onclick: () => { closeScreen(s); E.G.paused = false; SV.cur = null; save(); startPart(E.G.partIdx, null); } }, 'Recommencer le quartier'),
      h('button', { class: 'btn ghost', onclick: () => { E.G.paused = false; closeScreen(s); title(); } }, 'Accueil'))));
}
document.addEventListener('visibilitychange', () => { if (document.hidden && E.G.running && !E.G.end) pause(); });
window.addEventListener('keydown', e => { if ((e.code === 'Escape' || e.code === 'KeyP') && E.G.running && !E.G.paused) pause(); });

// ─── rappels du moteur ──────────────────────────────────────────────────────────────────────
E.cb = {
  hud,
  toast: t => toast(t),
  shop: (s, lit, main) => { showNote(s); if (s.bonus) toast('Commerce caché allumé : bravo !'); else if (lit === main) toast('Tous les commerces brillent : direction la sortie.'); },
  check: cur => { SV.cur = cur; SV.abil = [...E.G.abil]; SV.maxHearts = E.G.maxHearts; save(); toast('Devis signé : progression enregistrée'); },
  npc: async n => {
    pad.style.visibility = 'hidden';
    for (const l of n.lines) await say(n.sprite, n.name, n.role, l);
    if (n.deal) {
      let r;
      do {
        r = await say(n.sprite, n.name, n.role, 'Et pour ma commission, on fait comment ?', ['On la fixe par écrit, avant le premier contact.', 'On verra à la fin du projet.']);
        if (r === 1) await say('gestion_salut', 'Gestion', 'Devis et accords', 'Chez Digilago, tout est écrit avant de commencer. Même avec nos partenaires.');
      } while (r === 1);
      SND.play('stamp');
      await say(n.sprite, n.name, n.role, 'Parfait, accord signé. Le tram t’attend : le quartier d’affaires et ses grands comptes.');
      n.ok = true;
    }
    if (n.gives === 'radar') toast('Radar rejoint l’équipe : suis la flèche dorée.', 3200);
    if (n.gives === 'double') toast('Cumulus te porte : saute deux fois.', 3200);
    if (n.gives === 'pin') toast('L’épingle Google : sous une épingle, bouton doré pour t’accrocher.', 3600);
    if (n.gives === 'heart') toast('Ta Lanterne gagne une lumière.', 3000);
    closeDlg(); pad.style.visibility = '';
  },
  partDone: st => partDone(st),
};

// ─── fin de quartier, fin de niveau ──────────────────────────────────────────────────────────
function starsOf(st) {
  return [
    { on: true, t: 'Tous les commerces' },
    { on: st.total ? st.sparks / st.total >= .8 : true, t: 'Étincelles' },
    st.bonusTotal ? { on: st.bonus > 0, t: 'Commerce caché' } : { on: st.hits === 0, t: 'Sans perdre de lumière' },
  ];
}
async function partDone(st) {
  const idx = E.G.partIdx, last = idx === curLevel.parts.length - 1;
  const stars = starsOf(st);
  SV.stars[st.id] = Math.max(SV.stars[st.id] || 0, stars.filter(s => s.on).length);
  SV.abil = [...E.G.abil]; SV.maxHearts = E.G.maxHearts;
  track('jeu_lago_quartier', { quartier: st.id, etoiles: SV.stars[st.id] });
  if (!last) { SV.part = idx + 1; SV.cur = null; save(); return partCard(st, stars); }
  SV.done[curLevel.id] = true; SV.part = 0; SV.cur = null; SV.lvl = 0; save();
  track('jeu_lago_niveau', { niveau: curLevel.id });
  E.stop(); hudEl.classList.add('hide'); pad.style.visibility = 'hidden';
  // la Terre : Casablanca s'allume
  const caps = h('div', { class: 'cap' }); ui.append(caps);
  globeLoop(t => Object.assign(keyframes([{ t: 0, lon: -7.3, lat: 32.6, z: 5.2, casa: .2, casaFlare: 1, maPulse: .4 }, { t: 3, lon: -7, lat: 31.5, z: 3.4, casa: .95, casaFlare: 1, maPulse: .3 }, { t: 7, lon: -12, lat: 30, z: 1.6, casa: .95, casaFlare: .6, maPulse: .2 }], t), { t }));
  await wait(400);
  const p = h('p', { html: '<b>Casablanca brille.</b> Rabat, Marrakech, Fès et Tanger attendent leur lumière.' }); caps.append(p); requestAnimationFrame(() => p.classList.add('on'));
  SND.play('online');
  await wait(5200);
  caps.remove();
  levelCard(st, stars);
}
function statsRow(st) {
  return h('div', { class: 'stats' }, h('div', {}, h('b', {}, `${st.lit}`), 'commerces allumés'), h('div', {}, h('b', {}, `${st.sparks} / ${st.total}`), 'étincelles'),
    h('div', {}, h('b', {}, `${Math.floor(st.time / 60)}:${String(st.time % 60).padStart(2, '0')}`), 'temps'));
}
function starsRow(stars) {
  const row = h('div', { class: 'stars' }, ...stars.map(s => h('div', { class: 'st', html: (s.on ? ICON.star : ICON.starOff) + `<span>${s.t}</span>` })));
  setTimeout(() => [...row.children].forEach((c, i) => setTimeout(() => { c.classList.add('on'); if (stars[i].on) SND.play('star'); }, i * 260)), 350);
  return row;
}
function partCard(st, stars) {
  const s = screen('dim');
  const next = curLevel.parts[E.G.partIdx + 1];
  s.append(h('div', { class: 'card' }, h('div', { class: 'k' }, `${curLevel.city} · quartier ${E.G.partIdx + 1} sur ${curLevel.parts.length}`),
    h('h2', {}, `${st.name} `, h('em', {}, 'brille.')), starsRow(stars), statsRow(st),
    h('div', { class: 'pitch', style: 'grid-template-columns:1fr' }, h('div', {}, h('h3', {}, 'Et votre commerce, ', h('em', {}, 'il brille ?')),
      h('p', {}, 'Comme dans le jeu, mais pour de vrai : un site, une fiche Google et des réponses rapides. Prix écrit avant de commencer.')),
      h('div', { class: 'full' }, h('a', { class: 'btn small', href: CONF.cta + '&quartier=' + st.id, target: '_blank', rel: 'noopener', onclick: () => track('jeu_lago_demarrer', { depuis: st.id }) }, 'Démarrer mon projet'))),
    h('div', { class: 'row' }, h('button', { class: 'btn', onclick: async () => { await closeScreen(s); SND.play('whoosh'); startPart(E.G.partIdx + 1, null); } }, `Prendre le tram · ${next.name}`))));
}
const CODE = 'LAGO-CASA';
// « Café Atlas » devient « cafe-atlas.ma » : l'adresse que pourrait avoir le site
function dom(name) {
  const s = (name || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[’']/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 26).replace(/-+$/, '');
  return (s || 'votre-entreprise') + '.ma';
}
function levelCard(st, stars) {
  globeLoop(t => ({ lon: -10 + Math.sin(t * .1) * 6, lat: 31, z: 2.2, casa: .95, casaFlare: .5, t, cy: .5 }));
  const s = screen('dim');
  const total = Object.values(SV.stars).reduce((a, b) => a + b, 0);
  const input = h('input', { type: 'text', maxlength: '40', placeholder: 'Le nom de votre entreprise', value: SV.name || '', 'aria-label': 'Le nom de votre entreprise' });
  const nameB = h('b', {}, SV.name || 'Votre entreprise');
  const domB = h('span', { class: 'url' }, h('i'), dom(SV.name));
  input.addEventListener('input', () => { nameB.textContent = input.value.trim() || 'Votre entreprise'; domB.lastChild.textContent = dom(input.value); });
  const cta = h('a', { class: 'btn', href: CONF.cta + '&niveau=' + curLevel.id + '&code=' + CODE, target: '_blank', rel: 'noopener', onclick: () => { SV.name = input.value.trim(); save(); track('jeu_lago_demarrer', { depuis: 'niveau-' + curLevel.id, code: CODE }); } }, 'Utiliser mon code ', h('span', { html: ICON.arrow }));
  // le cadeau du niveau : un code qui offre la fiche Google (conditions sur la page Offres du site)
  const copy = h('button', { class: 'btn ghost small', onclick: async () => { try { await navigator.clipboard.writeText(CODE); copy.textContent = 'Copié'; } catch (e) { copy.textContent = CODE; } track('jeu_lago_code', { code: CODE }); } }, 'Copier');
  const gift = h('div', { class: 'gift' }, h('div', {}, h('span', { class: 'gk' }, 'Votre cadeau'), h('b', {}, CODE), h('small', {}, 'Votre fiche Google offerte pour la création de votre site. ', h('a', { href: CONF.site + 'offres.html#conditions', target: '_blank', rel: 'noopener' }, 'Conditions'))), copy);
  const light = h('button', { class: 'btn light small', onclick: () => { const v = input.value.trim(); if (!v) { input.focus(); return; } SV.name = v; save(); SND.play('online'); phone.animate([{ transform: 'scale(.9)', filter: 'brightness(.4)' }, { transform: 'scale(1)', filter: 'brightness(1)' }], { duration: 700, easing: 'cubic-bezier(.16,1,.3,1)' }); light.textContent = 'Allumée !'; } }, 'Allumer mon entreprise');
  const phone = h('div', { class: 'ph' }, h('div', { class: 'scr' }, domB, h('span', { class: 'lg', html: ICON.mark }), nameB, h('i'), h('i'), h('i'), h('i', { class: 'c' })));
  const share = h('button', { class: 'btn ghost small', onclick: async () => {
    const text = 'J’ai allumé Casablanca dans LAGO, le jeu de Digilago. À votre tour !';
    try { await navigator.share({ title: 'LAGO, allume le Maroc', text, url: CONF.lab }); }
    catch (e) { try { await navigator.clipboard.writeText(text + ' ' + CONF.lab); toast('Lien copié'); } catch (e2) { toast(CONF.lab); } }
  } }, 'Partager le jeu');
  s.append(h('div', { class: 'card' }, h('div', { class: 'k' }, `Niveau ${curLevel.n} terminé · ${total} étoiles`),
    h('h2', {}, `${curLevel.city} `, h('em', {}, 'est allumée.')),
    h('p', {}, 'La médina, la Corniche et le quartier d’affaires brillent. Prochaine ville : Rabat, dans une prochaine mise à jour.'),
    h('div', { class: 'pitch' },
      h('div', {}, h('h3', {}, 'La prochaine lumière, ', h('em', {}, 'c’est la vôtre.')),
        h('p', {}, 'Un site web élégant, pensé par des experts du référencement et des IA, pour que vos clients vous trouvent enfin.'),
        h('ul', {}, h('li', {}, 'Prix écrit avant de commencer'), h('li', {}, 'Première version en 72 heures'), h('li', {}, 'Réponse le jour même'), h('li', {}, 'Un seul interlocuteur'))),
      phone,
      h('div', { class: 'full' }, input, light),
      h('div', { class: 'full' }, gift),
      h('div', { class: 'full' }, cta)),
    h('div', { class: 'row' }, share, h('button', { class: 'btn ghost small', onclick: () => { closeScreen(s); title(); } }, 'Accueil'), h('button', { class: 'btn ghost small', onclick: () => levels() }, 'Les villes'))));
}

// ─── démarrage ──────────────────────────────────────────────────────────────────────────────
title();
E.rasterAll(p => { if (title.go && !loaded) title.go.textContent = `Chargement ${Math.round(p * 100)} %`; }).then(() => {
  loaded = true; if (title.go) { title.go.disabled = false; title.go.textContent = SV.intro ? 'Continuer' : 'Jouer'; }
});
window.LAGO_UI = { SV: () => SV, title, play, startPart, toast };
})();
</script>
