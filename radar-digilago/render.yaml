# Mise en ligne sur Render en une fois : le Radar + sa base PostgreSQL.
# Render › New › Blueprint › choisir ce dépôt › remplir les 3 champs ADMIN_* › Deploy Blueprint.
services:
  - type: web
    name: radar-digilago
    runtime: docker
    region: frankfurt
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    domains:
      - radar.digilago.ma
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_BASE_URL
        value: https://radar.digilago.ma
      - key: DATABASE_URL
        fromDatabase:
          name: radar-db
          property: connectionString
      # Demandés une seule fois à la création : votre compte administrateur.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
      # Google Places : à activer plus tard dans Environment, avec la clé.
      - key: GOOGLE_PLACES_ENABLED
        value: "false"

databases:
  - name: radar-db
    databaseName: radar
    user: radar
    plan: 0.1c-256mb
    region: frankfurt
    ipAllowList: [] # accessible uniquement par le Radar (réseau privé Render)
